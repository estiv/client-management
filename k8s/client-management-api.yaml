# Design-time Kubernetes manifests for Client Management (demo only).
# Ingress -> Service -> Deployment. Not applied to a cluster in this phase.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-management-api
  namespace: client-management
  labels:
    app: client-management-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client-management-api
  template:
    metadata:
      labels:
        app: client-management-api
    spec:
      containers:
        - name: client-management-api
          image: public.ecr.aws/docker/library/nginx:1.27-alpine
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_HOST
              value: client-db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: client-management-api
  namespace: client-management
spec:
  selector:
    app: client-management-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-management-api
  namespace: client-management
spec:
  rules:
    - host: clients.acme.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-management-api
                port:
                  number: 8080
